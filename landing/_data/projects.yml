# Projects shown on /projects/ (and the `featured` ones on the home page).
#
# Fields:
#   name:        project name (required)
#   description: one or two sentences (required)
#   url:         main link: repo, demo or write-up (optional)
#   links:       extra links, e.g. [{title: Demo, url: https://...}] (optional)
#   tags:        short list of technologies (optional)
#   featured:    true to show it on the home page (optional)

- name: EvalStudio
  description: >-
    A workspace to build, run and improve AI evaluations: datasets, rubrics,
    Q&A and RAG evaluations, live agent sessions and a model arena, all from
    one UI that works for engineers and non-technical experts.
  url: https://github.com/eval-ops/eval-studio
  tags: [AI evaluation, React, FastAPI, LiteLLM]
  featured: true

- name: rubric-kit
  description: >-
    My framework to generate rubrics and use them to evaluate AI agents, from
    Q&A pairs or exported chat sessions. It uses a panel of LLM judges, and it
    works fine with cheap or local models.
  url: https://github.com/narmaku/rubric-kit
  links:
    - title: Blog post
      url: /blog/posts/lets-talk-about-rubrics/
    - title: PyPI
      url: https://pypi.org/project/rubric-kit/
  tags: [Python, LLM evaluation, MCP]
  featured: true

- name: Walter, my AI butler
  description: >-
    An experiment with Openclaw: a personal butler on Telegram that manages my
    agenda and calendar, running in an LXC container in my home lab.
  url: /blog/posts/i-almost-got-enamored-with-my-butler/
  tags: [AI agents, Proxmox, home lab]
  featured: true

