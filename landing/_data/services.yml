# Offerings shown on /services/ and summarised on the home page.
#
# Fields: title, summary (one line, used on the home page), description,
# points (list of bullet points).

- title: Mentoring
  summary: One-on-one sessions for engineers who want some guidance with their career or skills.
  description: >-
    If you are a software engineer and want someone to talk to about your
    career, your code or your next step, I am happy to help. I have been in
    the industry for more than ten years.
  points:
    - Career growth and interviews
    - Working in Japan as a foreign engineer
    - Reviews of your code or side projects
    - Getting the most out of AI coding assistants

- title: AI agent evaluation
  summary: Help with testing and evaluating AI agents and MCP tools.
  description: >-
    This is what I spend most of my time on lately. I can help your team
    decide how to evaluate your agents, write rubrics and catch hallucinations
    and inconsistent behavior.
  points:
    - Evaluation strategy and rubrics (I built rubric-kit for this)
    - Reviews of MCP servers and tool design
    - Choosing judge models, including cheap and local ones

- title: Linux & developer tooling
  summary: Help with Linux workstations, containers and dev environments.
  description: >-
    I have used Linux for years and I enjoy tinkering with my setup and my
    home lab.
  points:
    - Container based dev environments (Distrobox, Podman)
    - Home lab setups with Proxmox
    - CI/CD and small automations
